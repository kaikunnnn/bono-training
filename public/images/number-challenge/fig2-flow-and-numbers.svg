<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="800" height="336" role="img" aria-label="新規獲得・7日間の体験の流れと数字の流れ。段階は 知る・興味を持つ・比べる・決める・払う。行動は YouTubeを見る・サイトに来る・料金ページを見る・プランを選ぶ・決済する。人数は 測れない・3,017人・412人・40人・6人（参考値）。前の段からの割合は 比べるが13.7%、決めるが9.7%で大きく減る">
<style>
.t{fill:#021710;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:13px}
.q{fill:#677470;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:12px}
.b{font-weight:700}
.m{font-family:"SF Mono",Menlo,Consolas,"Hiragino Sans",monospace}
.acct{fill:#047A53}
.hott{fill:#B8430F}
.box{fill:#FFFFFF;stroke:#D4D6CC;stroke-width:1.5}
.acc{fill:#E6F2EC;stroke:#047A53;stroke-width:1.5}
.big{fill:#F2F3F0;stroke:#677470;stroke-width:1.5}
.hot{fill:#FDEBDD;stroke:#F95A16;stroke-width:2}
.soft{fill:#F2F3F0;stroke:none}
.dash{fill:none;stroke:#677470;stroke-dasharray:4 4;stroke-width:1.2;opacity:.7}
.ln{stroke:#677470;stroke-width:1.3;fill:none}
.grid{stroke:#D4D6CC;stroke-width:1;fill:none}
.head{fill:#677470}
</style>
<rect x="0" y="0" width="800" height="336" fill="#F9F9F7"/>
<g transform="translate(20,20)">
<rect x="0" y="0" width="760" height="296" rx="10" fill="#FFFFFF" stroke="#D4D6CC"/>
<path d="M10 0 H750 A10 10 0 0 1 760 10 V28 H0 V10 A10 10 0 0 1 10 0 Z" fill="#E6F2EC"/>
<text class="q b acct" x="14" y="19" style="font-size:12px;letter-spacing:.06em">体験の流れ</text>
<rect x="0" y="166" width="760" height="28" fill="#FDEBDD"/>
<text class="q b hott" x="14" y="185" style="font-size:12px;letter-spacing:.06em">数字の流れ</text>
<rect x="0" y="28" width="760" height="40" fill="#F2F3F0"/>
<rect x="0" y="28" width="120" height="40" fill="#F2F3F0"/>
<rect x="0" y="68" width="120" height="40" fill="#F2F3F0"/>
<rect x="0" y="108" width="120" height="58" fill="#F2F3F0"/>
<rect x="0" y="194" width="120" height="50" fill="#F2F3F0"/>
<rect x="0" y="244" width="120" height="52" fill="#F2F3F0"/>
<rect x="504" y="244" width="128" height="52" fill="#FDEBDD"/>
<path class="grid" d="M0 28 H760"/>
<path class="grid" d="M0 68 H760"/>
<path class="grid" d="M0 108 H760"/>
<path class="grid" d="M0 166 H760"/>
<path class="grid" d="M0 194 H760"/>
<path class="grid" d="M0 244 H760"/>
<path class="grid" d="M120 28 V166 M120 194 V296"/>
<path class="grid" d="M248 28 V166 M248 194 V296"/>
<path class="grid" d="M376 28 V166 M376 194 V296"/>
<path class="grid" d="M504 28 V166 M504 194 V296"/>
<path class="grid" d="M632 28 V166 M632 194 V296"/>
<rect x="0.5" y="0.5" width="759" height="295" rx="10" fill="none" stroke="#D4D6CC"/>
<text class="q b" x="14" y="53">段階</text>
<text class="q b" x="14" y="93">行動</text>
<text class="q b" x="14" y="133">考え・気持ち</text><text class="q b" x="14" y="151">（想像）</text>
<text class="q b" x="14" y="224">人数</text>
<text class="q b" x="14" y="275">前の段から</text>
<text class="t b" x="132" y="53" style="font-size:14px">知る</text>
<text class="t" x="132" y="93" style="font-size:12.5px">YouTubeを見る</text>
<text class="t" x="132" y="133" style="font-size:12px">「この人の話、</text><text class="t" x="132" y="151" style="font-size:12px">分かりやすい」</text>
<text class="t b" x="260" y="53" style="font-size:14px">興味を持つ</text>
<text class="t" x="260" y="93" style="font-size:12.5px">サイトに来る</text>
<text class="t" x="260" y="133" style="font-size:12px">「どんな教材が</text><text class="t" x="260" y="151" style="font-size:12px">あるんだろう」</text>
<text class="t b" x="388" y="53" style="font-size:14px">比べる</text>
<text class="t" x="388" y="93" style="font-size:12.5px">料金ページを見る</text>
<text class="t" x="388" y="133" style="font-size:12px">「自分のレベルで</text><text class="t" x="388" y="151" style="font-size:12px">大丈夫？」</text>
<text class="t b" x="516" y="53" style="font-size:14px">決める</text>
<text class="t" x="516" y="93" style="font-size:12.5px">プランを選ぶ</text>
<text class="t" x="516" y="133" style="font-size:12px">「1ヶ月と3ヶ月、</text><text class="t" x="516" y="151" style="font-size:12px">どっち？」</text>
<text class="t b" x="644" y="53" style="font-size:14px">払う</text>
<text class="t" x="644" y="93" style="font-size:12.5px">決済する</text>
<text class="t" x="644" y="133" style="font-size:12px">「続けられる</text><text class="t" x="644" y="151" style="font-size:12px">かな」</text>
<text class="q" x="132" y="224">測れない</text>
<text class="t m" x="260" y="224" style="font-size:14px">3,017人</text>
<text class="t m" x="388" y="224" style="font-size:14px">412人</text>
<text class="t m" x="516" y="224" style="font-size:14px">40人</text>
<text class="t m" x="644" y="224" style="font-size:14px">6人</text>
<text class="q" x="644" y="238" style="font-size:10.5px">※参考値</text>
<text class="t m" x="388" y="275" style="font-size:14px">13.7%</text>
<text class="t m b hott" x="516" y="268" style="font-size:15px">9.7%</text>
<text class="q b hott" x="516" y="287" style="font-size:11.5px">← 大きく減る</text>
<text class="q" x="644" y="275">—</text>
</g>
</svg>
