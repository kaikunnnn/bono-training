<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 262" width="800" height="262" role="img" aria-label="事実から障壁の仮説を立て、打ち手を考える（例：新規獲得）。事実は、料金ページを見る 13.7% と、プランを選ぶ 9.7%。2つを並べて、流れ全体の障壁の仮説は「自分に合うか分からないまま進んでいる」。良い打ち手は、合うプランが分かるようにする（障壁を取り除く）。避ける打ち手は、選ぶボタンを大きくする（数字だけを上げにいく）">
<style>
.t{fill:#021710;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:14px}
.q{fill:#677470;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:12px}
.b{font-weight:700}
.m{font-family:"SF Mono",Menlo,Consolas,"Hiragino Sans",monospace}
.acct{fill:#047A53}
.hott{fill:#B8430F}
.box{fill:#FFFFFF;stroke:#D4D6CC;stroke-width:1.5}
.ok{fill:#E6F2EC;stroke:#047A53;stroke-width:1.5}
.ng{fill:#FDEBDD;stroke:#F95A16;stroke-width:1.5}
.dash{fill:#FFFFFF;stroke:#677470;stroke-dasharray:5 4;stroke-width:1.5}
.ln{stroke:#677470;stroke-width:1.3;fill:none}
.head{fill:#677470}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect x="0" y="0" width="800" height="262" fill="#F9F9F7"/>
<text class="q b" x="135.0" y="28" text-anchor="middle" style="letter-spacing:.06em">事実（数字）</text>
<text class="q b" x="400.0" y="28" text-anchor="middle" style="letter-spacing:.06em">障壁の仮説（流れ全体）</text>
<text class="q b" x="665.0" y="28" text-anchor="middle" style="letter-spacing:.06em">打ち手</text>
<rect class="box" x="30" y="46" width="210" height="92" rx="10"/>
<text class="q" x="135.0" y="82" text-anchor="middle">料金ページを見る</text>
<text class="t b m" x="135.0" y="112" text-anchor="middle" style="font-size:20px">13.7%</text>
<path class="ln" d="M243 92 H292" marker-end="url(#ar)"/>
<rect class="box" x="30" y="154" width="210" height="92" rx="10"/>
<text class="q" x="135.0" y="190" text-anchor="middle">プランを選ぶ</text>
<text class="t b m" x="135.0" y="220" text-anchor="middle" style="font-size:20px">9.7%</text>
<path class="ln" d="M243 200 H292" marker-end="url(#ar)"/>
<rect class="dash" x="295" y="46" width="210" height="200" rx="10"/>
<text class="t b" x="400.0" y="128.0" text-anchor="middle" style="font-size:15px">「自分に合うか</text>
<text class="t b" x="400.0" y="152.0" text-anchor="middle" style="font-size:15px">分からない」</text>
<text class="t b" x="400.0" y="176.0" text-anchor="middle" style="font-size:15px">まま進んでいる</text>
<path class="ln" d="M508 92 H557" marker-end="url(#ar)"/>
<rect class="ok" x="560" y="46" width="210" height="92" rx="10"/>
<text class="t b acct" x="576" y="98" style="font-size:18px">○</text>
<text class="t b" x="675.0" y="78" text-anchor="middle">合うプランが</text>
<text class="t b" x="675.0" y="100" text-anchor="middle">分かるようにする</text>
<text class="q b acct" x="675.0" y="122" text-anchor="middle">障壁を取り除く</text>
<path class="ln" d="M508 200 H557" marker-end="url(#ar)"/>
<rect class="ng" x="560" y="154" width="210" height="92" rx="10"/>
<text class="t b hott" x="576" y="206" style="font-size:18px">✕</text>
<text class="t b" x="675.0" y="186" text-anchor="middle">選ぶボタンを</text>
<text class="t b" x="675.0" y="208" text-anchor="middle">大きくする</text>
<text class="q b hott" x="675.0" y="230" text-anchor="middle">数字だけを上げにいく</text>
</svg>