<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" width="640" height="278" role="img" aria-label="今回取り組むのは継続率を上げること＝DAU（1日154人）を上げること。そのために、フェーズの違う2つのユーザーから1つを選ぶ。A：入会したばかりの人、測る数字は入会7日以内に1本終えた割合（今42%、上げたい）。B：学び始めた人、測る数字は学び始めて14日以上止まった割合（今42%、下げたい）">
<style>
.t{fill:#021710;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:13px}
.q{fill:#677470;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:12px}
.b{font-weight:700}
.m{font-family:"SF Mono",Menlo,Consolas,"Hiragino Sans",monospace}
.acct{fill:#047A53}
.hott{fill:#B8430F}
.box{fill:#FFFFFF;stroke:#D4D6CC;stroke-width:1.5}
.acc{fill:#E6F2EC;stroke:#047A53;stroke-width:1.5}
.big{fill:#F2F3F0;stroke:#677470;stroke-width:1.5}
.hot{fill:#FDEBDD;stroke:#F95A16;stroke-width:2}
.soft{fill:#F2F3F0;stroke:none}
.dash{fill:none;stroke:#677470;stroke-dasharray:4 4;stroke-width:1.2;opacity:.7}
.ln{stroke:#677470;stroke-width:1.3;fill:none}
.grid{stroke:#D4D6CC;stroke-width:1;fill:none}
.head{fill:#677470}
</style>
<rect x="0" y="0" width="640" height="278" fill="#F9F9F7"/>
<defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<g transform="translate(20,20)">
<text class="q b" x="0" y="12">今回取り組むこと</text>
<text class="q b" x="250" y="12">選ぶユーザー（フェーズで分ける）と、測る数字</text>
<rect class="big" x="0" y="82" width="190" height="110" rx="10"/>
<text class="q" x="18" y="112">継続率を上げる＝</text>
<text class="t b" x="18" y="146" style="font-size:24px">DAU</text>
<text class="q m" x="18" y="174" style="font-size:13px">1日 154人</text>
<path class="ln" d="M190 137 H218"/>
<path class="ln" d="M218 82 V190"/>
<path class="ln" d="M218 82 H246" marker-end="url(#ar1)"/>
<path class="ln" d="M218 190 H246" marker-end="url(#ar1)"/>
<rect class="acc" x="250" y="34" width="350" height="96" rx="10"/>
<text class="q" x="268" y="60">A ・ 入会したばかりの人</text>
<text class="t b" x="268" y="88" style="font-size:16px">入会7日以内に1本終えた割合</text>
<text class="t m acct" x="268" y="114">今 42% → ↑ 上げたい</text>
<rect class="acc" x="250" y="142" width="350" height="96" rx="10"/>
<text class="q" x="268" y="168">B ・ 学び始めた人</text>
<text class="t b" x="268" y="196" style="font-size:16px">学び始めて14日以上止まった割合</text>
<text class="t m acct" x="268" y="222">今 42% → ↓ 下げたい</text>
</g>
</svg>
