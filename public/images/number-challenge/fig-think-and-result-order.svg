<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 314" width="800" height="314" role="img" aria-label="考える順と結果の順。考える順は、ゴール（流れの最後）を決める→そこまでの体験を想像する（STEP 1）→体験の下に数字を置く（STEP 2）。結果の順は、体験を良くする→各段を通る人が増える→ゴールの数字が上がる。課金ボタンを大きくするのは、体験を飛ばして数字だけ動かそうとする打ち手で、ユーザーの迷いは残ったまま">
<style>
.t{fill:#021710;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:13px}
.q{fill:#677470;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:12px}
.b{font-weight:700}
.m{font-family:"SF Mono",Menlo,Consolas,"Hiragino Sans",monospace}
.acct{fill:#047A53}
.hott{fill:#B8430F}
.box{fill:#FFFFFF;stroke:#D4D6CC;stroke-width:1.5}
.acc{fill:#E6F2EC;stroke:#047A53;stroke-width:2}
.soft{fill:#F2F3F0;stroke:none}
.hot{fill:#FDEBDD;stroke:#F95A16;stroke-width:1.5}
.ln{stroke:#677470;stroke-width:1.3;fill:none}
.lna{stroke:#047A53;stroke-width:1.5;fill:none}
.head{fill:#677470}
.heada{fill:#047A53}
</style>
<defs><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker>
<marker id="arga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="heada" d="M0 0L10 5L0 10z"/></marker></defs>
<rect x="0" y="0" width="800" height="314" fill="#F9F9F7"/>
<text class="t b" x="40" y="34" style="font-size:14px">考える順</text>
<rect class="box" x="40" y="50" width="340" height="44" rx="10"/>
<text class="t b" x="210" y="77" text-anchor="middle" style="font-size:14px">ゴール（流れの最後）を決める</text>
<path class="ln" d="M210 96 V112" marker-end="url(#arg)"/>
<rect class="box" x="40" y="114" width="340" height="44" rx="10"/>
<text class="t b" x="210" y="141" text-anchor="middle" style="font-size:14px">そこまでの体験を想像する（STEP 1）</text>
<path class="ln" d="M210 160 V176" marker-end="url(#arg)"/>
<rect class="box" x="40" y="178" width="340" height="44" rx="10"/>
<text class="t b" x="210" y="205" text-anchor="middle" style="font-size:14px">体験の下に数字を置く（STEP 2）</text>
<text class="t b acct" x="420" y="34" style="font-size:14px">結果の順</text>
<rect class="box" x="420" y="50" width="340" height="44" rx="10"/>
<text class="t b" x="590" y="77" text-anchor="middle" style="font-size:14px">体験を良くする</text>
<path class="lna" d="M590 96 V112" marker-end="url(#arga)"/>
<rect class="box" x="420" y="114" width="340" height="44" rx="10"/>
<text class="t b" x="590" y="141" text-anchor="middle" style="font-size:14px">各段を通る人が増える</text>
<path class="lna" d="M590 160 V176" marker-end="url(#arga)"/>
<rect class="acc" x="420" y="178" width="340" height="44" rx="10"/>
<text class="t b" x="590" y="205" text-anchor="middle" style="font-size:14px">ゴールの数字が上がる</text>
<rect class="hot" x="40" y="250" width="720" height="44" rx="10"/>
<text class="t b hott" x="58" y="277" style="font-size:14px">✕ 課金ボタンを大きくする</text>
<text class="t" x="250" y="277">体験を飛ばして、数字だけ動かそうとする。ユーザーの迷いは残ったまま</text>
</svg>