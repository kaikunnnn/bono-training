<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BONO Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{ --bg:#F3F3F1; --surface:#FFFFFF; --fg:#1F2120; --muted:#5B5F5C; --line:#D9DAD6; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans JP",system-ui,sans-serif; line-height:1.7; }
main{ max-width:720px; margin:0 auto; padding:56px 16px 80px; }
h1{ font-size:28px; margin:0 0 8px; }
.lead{ color:var(--muted); margin:0 0 40px; font-size:15px; }
h2{ font-size:14px; color:var(--muted); font-weight:500; margin:0 0 12px; }
li{ min-width:0; }
ul{ list-style:none; margin:0; padding:0; display:grid; gap:12px; }
a.card{ display:block; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 22px; color:inherit; text-decoration:none; }
a.card:hover{ border-color:var(--fg); }
.title{ font-size:17px; font-weight:700; }
.desc{ color:var(--muted); font-size:14px; margin-top:4px; }
.links{ margin-top:8px; font-size:13px; color:var(--muted); }
.links a{ color:var(--fg); }
</style>
<main>
  <h1>BONO Labs</h1>
  <p class="lead">BONOで作った見本や試作のページです。</p>

  <section>
    <h2>UIの基礎</h2>
    <ul>
      <li>
        <a class="card" href="/labs/ui-fundamentals/bad-ui">
          <div class="title">配色のダメUI</div>
          <div class="desc">配色のよくあるミスを入れたタスク管理アプリの画面。4つの段階で直したアフターまで切り替えて見られます。YouTube「配色UIデザインの基本」の題材。</div>
        </a>
        <div class="links">動画で使った画像: <a href="/labs/ui-fundamentals/bad-ui/before.png">ビフォー</a> / <a href="/labs/ui-fundamentals/bad-ui/after.png">アフター</a> / <a href="/labs/ui-fundamentals/bad-ui/beforeafter.png">並べた画像</a></div>
      </li>
      <li>
        <a class="card" href="/labs/ui-fundamentals/color-fix">
          <div class="title">ダメなUIを4段階で直す</div>
          <div class="desc">配色のダメUIを、役割・量・意味・数値の順に直していく記事。変えた場所を1か所ずつ、直す前と直した後の拡大で並べています。</div>
        </a>
      </li>
    </ul>
  </section>
</main>
</html>
