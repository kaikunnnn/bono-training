<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Trainer — プロトタイプ v0.4</title>
<style>
  :root {
    --ink: #000000; --sec: #4B4B4B; --ter: #5E5E5E;
    --surface: #F3F3F3; --bg: #FAFAFA; --card: #FFFFFF;
    --border: rgba(0,0,0,0.12); --accent: #276EF1;
    --green: #0E8345; --red: #DE1135; --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.7; }
  .topbar { display: flex; align-items: center; gap: 24px; padding: 14px 32px; background: var(--card);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .topbar .logo { font-weight: 700; font-size: 15px; }
  .topbar .crumb { color: var(--ter); font-size: 13px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .container { max-width: 720px; margin: 0 auto; padding: 40px 24px 96px; }
  .container.wide { max-width: 960px; }
  h1 { font-size: 26px; line-height: 1.4; margin-bottom: 8px; }
  .lead { color: var(--sec); font-size: 15px; margin-bottom: 24px; }
  .sectionlabel { font-size: 13px; font-weight: 600; color: var(--ter); margin-bottom: 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 24px; margin-bottom: 16px; }
  .pill { display: inline-block; background: var(--surface); border-radius: 999px; padding: 3px 12px;
    font-size: 12px; font-weight: 600; color: var(--sec); margin-right: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 24px;
    border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; border: none;
    font-family: inherit; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn.primary { background: var(--ink); color: #fff; width: 100%; }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--ink); width: 100%; }
  .btn.ghost { background: none; color: var(--accent); height: auto; padding: 4px 8px; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btnrow { display: flex; gap: 12px; margin-top: 8px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; font-size: 14px; font-family: inherit; resize: vertical; background: var(--card); }
  textarea:focus { outline: 2px solid var(--ink); border-color: transparent; }

  /* ===== レッスンカード(v0.4) ===== */
  .toc { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px 28px; margin-bottom: 24px; }
  .toc .toctitle { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .tocitem { display: flex; gap: 12px; padding: 8px 0; font-size: 14px; align-items: baseline;
    border-bottom: 1px solid var(--border); }
  .tocitem:last-child { border-bottom: none; }
  .tocitem .tocnum { font-weight: 700; color: var(--accent); font-size: 12px; min-width: 64px; }
  .tocitem .tocdo { color: var(--green); }
  .lesson { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px 32px; margin-bottom: 24px; }
  .lesson .lessonnum { display: inline-block; background: var(--ink); color: #fff; border-radius: 999px;
    padding: 3px 14px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
  .lesson .lessonnum.do { background: var(--green); }
  .lesson h2 { font-size: 20px; margin-bottom: 14px; }
  .goalbox { background: var(--surface); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 6px; font-size: 14px; }
  .goalbox b { display: inline-block; }
  .whybox { border-left: 3px solid var(--accent); padding: 6px 16px; margin: 6px 0 16px; font-size: 13px; color: var(--sec); }
  .lesson .body p { color: var(--sec); margin: 10px 0; font-size: 15px; }
  .lesson .body b { color: var(--ink); }
  /* 引用リンクカード */
  .refsec { margin-top: 18px; }
  .refsec .reftitle { font-size: 12px; font-weight: 700; color: var(--ter); margin-bottom: 8px; letter-spacing: .05em; }
  a.reflink { display: block; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 10px; color: inherit; background: var(--card); transition: border-color .15s; }
  a.reflink:hover { border-color: var(--accent); text-decoration: none; }
  a.reflink.primary { border-left: 4px solid var(--accent); }
  .refhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .refbadge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 8px; background: var(--accent); color: #fff; }
  .refbadge.sub { background: var(--surface); color: var(--ter); }
  .refsrc { font-size: 14px; font-weight: 700; color: var(--ink); }
  .refopen { margin-left: auto; font-size: 12px; color: var(--accent); white-space: nowrap; }
  .refquote { font-size: 13px; color: var(--ink); margin-top: 8px; line-height: 1.7; }
  .refquote::before { content: "“"; color: var(--ter); }
  .refquote::after { content: "”"; color: var(--ter); }
  .refnote { font-size: 12px; color: var(--ter); margin-top: 6px; }
  /* フィールドワーク */
  .fieldwork { background: #EAF3EC; border: 1px solid rgba(14,131,69,.3); border-radius: var(--radius);
    padding: 18px 22px; margin: 14px 0; }
  .fieldwork .fwtitle { font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--green); }
  .fieldwork ol { margin: 8px 0 8px 20px; font-size: 14px; color: var(--sec); }
  .fieldwork li { margin: 4px 0; }
  .kanten { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; margin: 10px 0; font-size: 14px; }
  .kanten b { color: var(--green); }
  .policy { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
  .policy th, .policy td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  .policy th { background: var(--surface); font-size: 12px; color: var(--ter); }
  .policy .kaishaku { color: var(--ter); }
  .duo { display: flex; gap: 16px; margin: 12px 0; }
  .duo .dcol { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .duo .dtitle { font-weight: 700; font-size: 13px; margin-bottom: 10px; }
  .duo .dnote { font-size: 12px; color: var(--ter); margin-top: 8px; line-height: 1.6; }
  .mockfield { border: 1px solid #B0B0B0; border-radius: 8px; padding: 8px 12px; background: #fff; }
  .mockfield .flabel { font-size: 10px; color: var(--ter); }
  .mockfield .fval { font-size: 13px; }
  .mocklabel { font-size: 12px; margin-bottom: 4px; }
  .decidebox { background: var(--surface); border-radius: var(--radius); padding: 16px 20px; font-size: 14px; }
  .decidebox ol { margin: 6px 0 0 20px; }
  .decidebox li { margin: 4px 0; }

  .checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px; cursor: pointer; }
  .checklist input { margin-top: 4px; accent-color: var(--ink); }
  .checklist .why { color: var(--ter); font-size: 12px; }
  details.hint { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); margin-bottom: 8px; }
  details.hint summary { padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; list-style: none; }
  details.hint summary::before { content: "▸ "; color: var(--ter); }
  details.hint[open] summary::before { content: "▾ "; }
  details.hint .hintbody { padding: 0 16px 14px; font-size: 14px; color: var(--sec); }
  .three { display: flex; gap: 16px; margin: 16px 0; }
  .three .tcol { flex: 1; }
  .three .tlabel { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .three .timg { width: 100%; height: 420px; object-fit: contain; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); display: block; }
  .three .tsub { font-size: 11px; color: var(--ter); margin-top: 6px; line-height: 1.5; }
  .uploadbox { width: 100%; height: 420px; background: var(--surface); border: 1px dashed #B0B0B0;
    border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
    color: var(--ter); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
  .obsbox { width: 100%; height: 420px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; font-size: 12px; color: var(--sec); overflow-y: auto; line-height: 1.9; }
  .aspect { display: flex; gap: 16px; align-items: flex-start; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 10px; }
  .aspect .aname { font-weight: 700; font-size: 14px; min-width: 80px; }
  .aspect .adesc { flex: 1; font-size: 13px; color: var(--sec); }
  .aspect select { border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-family: inherit; font-size: 13px; }
  .grid { display: flex; gap: 16px; }
  .odai { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .odai.locked { opacity: .45; }
  .odai h3 { font-size: 16px; margin-bottom: 6px; }
  .odai .meta { font-size: 12px; color: var(--ter); margin-bottom: 10px; }
  .footer-note { color: var(--ter); font-size: 12px; margin-top: 32px; border-top: 1px solid var(--border); padding-top: 16px; }
  .tagrow { margin: 8px 0 16px; }
  .learned { display: inline-block; background: #EAF3EC; color: var(--green); border-radius: 999px;
    padding: 4px 14px; font-size: 13px; font-weight: 600; margin: 0 6px 6px 0; }
  .err { color: var(--red); font-size: 13px; display: none; margin-top: 6px; }
  .whylist { display:none; font-size:12px; background:var(--surface); border-radius:8px; padding:12px 16px; margin-top:8px; line-height:2; }
  .flowbar { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ter); margin-bottom:20px; flex-wrap:wrap; }
  .flowbar .fstep { background: var(--surface); border-radius: 999px; padding: 4px 12px; font-weight: 600; }
  .flowbar .fstep.now { background: var(--ink); color: #fff; }
  .qlabel { font-weight: 600; font-size: 15px; margin: 16px 0 4px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">UI Trainer <span style="font-weight:400;color:var(--ter);font-size:12px">パターン1(v0.4)</span></span>
  <span class="crumb" id="crumb">お題</span>
  <span style="margin-left:auto;font-size:12px"><a href="pattern2.html">パターン2を見る →</a></span>
</div>

<section class="screen active" id="s1"><div class="container wide">
  <h1>今日のお題</h1>
  <p class="lead">実務で本当に作る画面だけ。<b>作ることが主役</b>です — 短いインプットのあと、すぐFigmaで制作に入ります。すべての教えは実在のデザインシステムと実測観察から引用します。</p>
  <div class="grid" id="odaiGrid"></div>
  <p class="footer-note">流れ: ブリーフ(1分)→ インプット(10分・いつでも見返せる)→ 制作(25分)→ 実物・模範と見比べる → 学びを言葉に。</p>
</div></section>

<section class="screen" id="s2"><div class="container" id="briefContainer"></div></section>
<section class="screen" id="s3"><div class="container" id="inputContainer"></div></section>
<section class="screen" id="s4"><div class="container" id="buildContainer"></div></section>
<section class="screen" id="s5"><div class="container wide" id="compareContainer"></div></section>
<section class="screen" id="s6"><div class="container" id="doneContainer"></div></section>

<script>
/* =====================================================================
   引用DB — docs/10-ledger/ から転記(記憶からの記述なし)
===================================================================== */
const CITES = {
  "S-14": { src:"GOV.UK Service Manual — Structuring forms", quote:"Start by splitting the form across multiple pages with each page containing just one thing", url:"https://www.gov.uk/service-manual/design/form-structure" },
  "S-11": { src:"Laws of UX — Jakob's Law(ヤコブの法則)", quote:"Users spend most of their time on other sites. This means that users prefer your site to work the same way as all the other sites they already know.", url:"https://lawsofux.com/jakobs-law/" },
  "S-06": { src:"NN/g — 10 Usability Heuristics #6", quote:"Minimize the user's memory load by making elements, actions, and options visible.", url:"https://www.nngroup.com/articles/ten-usability-heuristics/" },
  "S-01": { src:"NN/g — Visual Hierarchy in UX", quote:"the organization of the design elements on the page so that the eye is guided to consume each design element in the order of intended importance", url:"https://www.nngroup.com/articles/visual-hierarchy-ux-definition/" },
  "S-02": { src:"NN/g — Proximity Principle(近接の原則)", quote:"Items close together are likely to be perceived as part of the same group — sharing similar functionality or traits.", url:"https://www.nngroup.com/articles/gestalt-proximity/" },
  "P-02": { src:"GOV.UK Design System — Text input", quote:"All text inputs must have labels, and in most cases the label should be visible.", url:"https://design-system.service.gov.uk/components/text-input/" },
  "P-03": { src:"NN/g — Website Forms Usability", quote:"Placeholder text causes many usability problems, and is best avoided.", url:"https://www.nngroup.com/articles/web-form-design/" },
  "P-05": { src:"NN/g — Website Forms Usability", quote:"Eliminating unnecessary fields requires more time, but the reduced user effort and increased completion rates make it worthwhile.", url:"https://www.nngroup.com/articles/web-form-design/" },
  "P-06": { src:"NN/g — Website Forms Usability", quote:"Multiple columns interrupt the vertical momentum of moving down the form.", url:"https://www.nngroup.com/articles/web-form-design/" },
  "P-08": { src:"GOV.UK Design System — Error message", quote:"Avoid messages like: 'An error occurred', 'Answer the question', 'Select an option', 'This field is required'.", url:"https://design-system.service.gov.uk/components/error-message/" },
  "P-10": { src:"GOV.UK Design System — Error message", quote:"Do not clear any form fields when showing the Error message component. Keep both passing and failing answers.", url:"https://design-system.service.gov.uk/components/error-message/" },
  "P-12": { src:"GOV.UK Design System — Button", quote:"Write button text in sentence case, describing the action it performs.", url:"https://design-system.service.gov.uk/components/button/" },
  "P-14": { src:"GOV.UK Design System — Text input(ヒント)", quote:"Keep hint text to a single short sentence, without any full stops.", url:"https://design-system.service.gov.uk/components/text-input/" },
  "P-16": { src:"GOV.UK Design System — Passwords(パターン)", quote:"You should follow this pattern whenever you need users to create or enter a password.", url:"https://design-system.service.gov.uk/patterns/passwords/" },
  "F-05": { src:"Apple HIG — Accessibility(タップ領域)", quote:"iOS, iPadOS — Default control size: 44x44 pt", url:"https://developer.apple.com/design/human-interface-guidelines/accessibility" },
  "Q-09": { src:"Uber Base 公式コード — Button実トークン", quote:"buttonPrimaryFill = black(#000000)/ buttonBorderRadius: '8px' / default高さ48px", url:"https://github.com/uber/baseweb" },
  "V-06": { src:"Airbnb ログイン画面(実物スクリーンショット 2026-07-04)", quote:"見出しは Welcome to Airbnb / 入力は1枠 / Continue → or → Continue with Apple/Facebook/Google(全て同一サイズ)/ 最下部に Log in", url:"assets/real-airbnb.png" },
  "V-obs": { src:"実測観察 — Uber / Spotify / Vercel の登録画面(2026-07-04取得)", quote:"4サービス全てで、初期画面の入力は1つだけ・ソーシャルは「Continue with ◯◯」の統一文言・見出しは質問または価値提案の1文だった", url:"https://auth.uber.com/login/" },
  "SET-01": { src:"Apple HIG — Settings", quote:"Minimize the number of settings you offer. (中略) too many settings can make the experience feel less approachable, while also making it hard to find a particular setting.", url:"https://developer.apple.com/design/human-interface-guidelines/settings" },
  "SET-03": { src:"Apple HIG — Settings", quote:"Putting this type of option in a separate settings area disconnects it from its context, requiring people to suspend their task to make adjustments", url:"https://developer.apple.com/design/human-interface-guidelines/settings" },
  "SET-05": { src:"Apple HIG — Lists and tables", quote:"the grouped style uses headers, footers, and additional space to separate groups of data", url:"https://developer.apple.com/design/human-interface-guidelines/lists-and-tables" },
  "SET-06": { src:"Material Design 3 — Lists", quote:"Container and label text are required. All other elements are optional", url:"https://m3.material.io/components/lists/guidelines" },
  "SET-07": { src:"Apple HIG — Lists and tables(シェブロンの約束)", quote:"A disclosure indicator reveals the next level in a hierarchy; it doesn't show details about the item.", url:"https://developer.apple.com/design/human-interface-guidelines/lists-and-tables" },
  "SET-08": { src:"Apple HIG — Toggles", quote:"Use the switch toggle style only in a list row.", url:"https://developer.apple.com/design/human-interface-guidelines/toggles" },
  "SET-09": { src:"NN/g — Toggle-Switch Guidelines", quote:"Toggle switches should take immediate effect and should not require the user to click Save or Submit to apply the new state.", url:"https://www.nngroup.com/articles/toggle-switch-guidelines/" },
  "SET-11": { src:"NN/g — Toggle-Switch Guidelines(ラベル)", quote:"The toggle labels should describe what the control will do when the switch is on.", url:"https://www.nngroup.com/articles/toggle-switch-guidelines/" },
  "SET-12": { src:"NN/g — Confirmation Dialogs", quote:"Instead of Yes/No answers, provide response options that summarize what will happen for each possible response. (例: Delete file / Keep file)", url:"https://www.nngroup.com/articles/confirmation-dialog/" },
  "SET-15": { src:"Material Design 3 — Lists(区切り線)", quote:"Limit dividers to uncontained or complex lists, only when a stronger visual separation is necessary", url:"https://m3.material.io/components/lists/guidelines" },
  "OBS-ACC": { src:"実測観察 — GitHub / Slack / Notion / Firefox の設定(2026-07-06取得)", quote:"4サービスすべてで、アカウント/プロフィールが設定の入口・最上位に置かれていた(例: Firefoxの第1パネルは Account and sync)", url:"https://support.mozilla.org/en-US/kb/firefox-options-preferences-and-settings" },
  "OBS-DEL": { src:"GitHub Docs — アカウント削除の実物手順", quote:"削除ボタンは Account 設定ページ下部の Delete account セクションにあり、実行前にユーザー名+提示フレーズの二重タイプ確認を要求する", url:"https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-personal-account-on-github/managing-personal-account-settings/deleting-your-personal-account" },
  "OBS-GATE": { src:"Apple サポート — iOS通知設定の実物手順", quote:"Settings → Apps → 通知 → Allow Notifications(親トグル)をオンにすると、配下でサウンド・配置・見た目を調整できる。手順に保存ボタンは一切登場しない", url:"https://support.apple.com/en-us/120681" },
};

/* =====================================================================
   お題レジストリ(v0.4: 1カード=学ぶこと1つ)
   card: { type:'basic'|'do'|'wrap', title, goal(🎯学ぶこと), why(🧭制作のどこで使うか),
           body(html), refs:[{c:CITE-ID, w:'必読'|'参考', note}] }
===================================================================== */
const ODAI = {
  "01": {
    title:"お題01 — Sign Up", level:"初級", time:"約60分",
    tags:["フォーム","入力パターン","CTA"], paceLabel:"はじめてのパターン(インプット厚め)",
    cardDesc:"音楽アプリの登録画面。ラベル・タップ領域・視覚階層の基礎。",
    make:"音楽アプリ「Tempo」の新規登録画面(iOS 390×844)をFigmaで1枚",
    scenario:`10〜20代向け音楽アプリ<b>「Tempo」</b>の新規登録画面。登録は<b>メール確認コード式+ソーシャル(Apple / Google)</b>。ユーザーの目的は音楽を聴くことで、登録は通過点——<b>「考えずに30秒で通過できる」</b>が勝ち筋です。`,
    elements:[
      "Tempoのロゴ",
      "見出し(機能名ではなく、歓迎か価値を伝える1文)",
      "メールアドレスの入力欄",
      "「続行すると確認コードが届く」ことの予告(1文)",
      "続行ボタン(CTA)",
      "「または」の区切り",
      "ソーシャルボタン2本(Appleで続行 / Googleで続行)",
      "ログイン導線(すでにアカウントがある人の脱出路)",
    ],
    checklist:[
      ["入力欄のラベルが常時見える","P-02"],
      ["プレースホルダーをラベル代わりにしていない","P-03"],
      ["押せる要素は44×44pt以上","F-05"],
      ["有彩色はCTA系の1色だけ","V-obs"],
      ["ソーシャルボタンが完全に同一サイズ","V-06"],
      ["CTAの文言が動作を表している","P-12"],
      ["既存ユーザーの脱出路(ログイン導線)がある","S-06"],
      ["余白が8の倍数で、グループ間 > グループ内","S-02"],
      ["1カラム縦積み","P-06"],
      ["「続行すると何が起きるか」の予告がある","P-14"],
      ["本文コントラスト4.5:1以上",null],
    ],
    parts:[["テキスト入力","GOV.UK Design System","https://design-system.service.gov.uk/components/text-input/"],
           ["ボタン(黒CTA)","Uber Base 実トークン","https://github.com/uber/baseweb"],
           ["タップ領域 44pt","Apple HIG","https://developer.apple.com/design/human-interface-guidelines/accessibility"]],
    inputCards:[
      { type:'basic', title:"1画面には、1つの用事だけ",
        goal:"登録画面の役割は「連絡先を渡して次へ進む」——それだけ、と捉えること",

/* =====================================================================
   エンジン
===================================================================== */
const state = { odai:"01", notes:{}, compare:{}, finalWord:{}, startedAt:{}, finished:{}, citesOpened:0 };
const cur = () => ODAI[state.odai];

function go(id) {
  saveMemo();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  const o = cur();
  const crumbs = { s1:'お題', s2:o.title+' — ブリーフ', s3:o.title+' — インプット', s4:o.title+' — 制作', s5:o.title+' — 比較', s6:o.title+' — 完了' };
  document.getElementById('crumb').textContent = crumbs[id] || '';
  if (id === 's1') renderHome();
  if (id === 's2') renderBrief();
  if (id === 's3') renderInput();
  if (id === 's4') { renderBuild(); if (!state.startedAt[state.odai]) state.startedAt[state.odai] = Date.now(); tick(); }
  if (id === 's5') renderCompare();
  if (id === 's6') renderDone();
  save();
}
function startOdai(id) { state.odai = id; go('s2'); }
function saveMemo() {
  const m = document.getElementById('fwMemo');
  if (m) state.notes[state.odai] = m.value.trim();
}
function flowbar(now) {
  const steps = ['ブリーフ','インプット','制作','比較','言語化'];
  return `<div class="flowbar">` + steps.map((s,i)=>`<span class="fstep ${i===now?'now':''}">${s}</span>${i<4?'→':''}`).join('') + `</div>`;
}

/* ---- 引用リンクカード ---- */
function refsHtml(refs) {
  if (!refs || !refs.length) return '';
  return `<div class="refsec"><div class="reftitle">📚 参考(引用元 — クリックで原文へ)</div>` +
    refs.map(r => {
      const c = CITES[r.c];
      const isAsset = c.url.startsWith('assets/');
      const openLabel = isAsset ? '実物を見る ↗' : '原文を開く ↗';
      const quote = r.w === '必読' ? `<div class="refquote">${c.quote}</div>` : '';
      return `<a class="reflink ${r.w==='必読'?'primary':''}" href="${c.url}" target="_blank">
        <div class="refhead"><span class="refbadge ${r.w==='必読'?'':'sub'}">${r.w}</span>
          <span class="refsrc">${c.src}</span><span class="refopen">${openLabel}</span></div>
        ${quote}
        <div class="refnote">${r.note}</div>
      </a>`;
    }).join('') + `</div>`;
}

/* ---- S1 ---- */
function renderHome() {
  document.getElementById('odaiGrid').innerHTML = Object.entries(ODAI).map(([id,o]) => `
    <div class="odai">
      <h3>${o.title}</h3>
      <div class="meta">${o.level}・${o.time}・${o.paceLabel}</div>
      ${o.tags.map(t=>`<span class="pill">${t}</span>`).join('')}
      <p style="font-size:13px;color:var(--sec);margin:10px 0 16px">${o.cardDesc}</p>
      <button class="btn primary" onclick="startOdai('${id}')">${state.finished[id] ? 'もう一度' : 'はじめる'}</button>
    </div>`).join('') + `
    <div class="odai locked">
      <h3>お題03 — ログインとエラー回復</h3>
      <div class="meta">初級・45分</div>
      <span class="pill">エラー表示</span><span class="pill">フォーム(再)</span>
      <p style="font-size:13px;color:var(--sec);margin:10px 0 16px">GOV.UKのエラー回復パターンを経典に。</p>
      <button class="btn secondary" disabled>本実装で提供</button>
    </div>`;
}

/* ---- S2 ブリーフ ---- */
function checklistHtml(o) {
  return o.checklist.map(([label, cite]) => {
    const c = cite && CITES[cite];
    const link = c && !c.url.startsWith('assets/')
      ? ` <a class="why" href="${c.url}" target="_blank">根拠→</a>`
      : (cite ? ` <span class="why">(${cite})</span>` : '');
    return `<label><input type="checkbox"><span>${label}${link}</span></label>`;
  }).join('');
}
function renderBrief() {
  const o = cur();
  document.getElementById('briefContainer').innerHTML = `
    ${flowbar(0)}
    <div class="tagrow"><span class="pill">${o.level}</span><span class="pill">${o.time}</span><span class="pill">${o.paceLabel}</span></div>

    <div class="card"><div class="sectionlabel">① シナリオ</div><p>${o.scenario}</p></div>

      ${o.elements.map(e=>`<div style="display:flex;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px solid var(--border)"><span style="color:var(--ter)">▫︎</span><span>${e}</span></div>`).join('')}
    </div>

      <div class="checklist">${checklistHtml(o)}</div></div>
    <div class="card"><div class="sectionlabel">④ 使ってよい部品(実在デザインシステムから引用)</div>
      <div class="grid" style="margin-top:8px">${o.parts.map(([n,s,u])=>`
        <div style="flex:1;background:var(--surface);border-radius:8px;padding:12px 14px">

    <div class="card"><div class="sectionlabel">⑤ 提出のかたち</div>
      <p style="font-size:14px">完成画面のスクショ+<b>「なぜその判断をしたか」</b>の一言。説明が丁寧なほど、比較が深くなります。</p></div>
    <button class="btn primary" onclick="go('s3')">インプットへ(約10分)</button>`;
}

/* ---- S3 インプット ---- */
function renderInput() {
  const o = cur();
  const started = !!state.startedAt[state.odai];
  const basics = o.inputCards.filter(c => c.type === 'basic');
  let bIdx = 0, tocIdx = 0;
  const toc = o.inputCards.filter(c => c.type !== 'wrap').map(c => {
    tocIdx++;
    if (c.type === 'do') return `<div class="tocitem"><span class="tocnum tocdo">やること</span><span>${c.title} — <span style="color:var(--ter)">${c.goal}</span></span></div>`;
    bIdx++;
    return `<div class="tocitem"><span class="tocnum">基本 ${bIdx}</span><span><b>${c.title}</b> — <span style="color:var(--ter)">${c.goal}</span></span></div>`;
  }).join('');
  let bNum = 0;
  const cards = o.inputCards.map(c => {
    let badge;
    if (c.type === 'do') badge = `<span class="lessonnum do">🔍 やること — フィールドワーク</span>`;
    else if (c.type === 'wrap') badge = `<span class="lessonnum" style="background:var(--surface);color:var(--ink)">✅ まとめ</span>`;
    else { bNum++; badge = `<span class="lessonnum">この制作で学ぶ基本 ${bNum}/${basics.length}</span>`; }
    return `<div class="lesson">
      ${badge}
      <h2>${c.title}</h2>
      <div class="goalbox">🎯 <b>ここで学ぶこと:</b> ${c.goal}</div>
      <div class="whybox">🧭 <b>制作のどこで使う?</b> — ${c.why}</div>
      <div class="body">${c.body}</div>
      ${refsHtml(c.refs)}
    </div>`;
  }).join('');
  document.getElementById('inputContainer').innerHTML = `
    ${flowbar(1)}
    <h1 style="font-size:22px">${o.title} — インプット</h1>
    <p class="lead">読むだけでOK、テストはありません。制作中も<b>いつでも見返せます</b>。</p>
    <div class="toc">
      <div class="toctitle">このお題で学ぶUIデザインの基本(${basics.length}つ)+やること</div>
      ${toc}
    </div>
    ${cards}
    <button class="btn primary" onclick="go('s4')">${started ? '制作にもどる' : 'Figmaで作りはじめる'}</button>`;
  const memo = document.getElementById('fwMemo');
  if (memo && state.notes[state.odai]) memo.value = state.notes[state.odai];
}

/* ---- S4 制作 ---- */
function renderBuild() {
  const o = cur();
  document.getElementById('buildContainer').innerHTML = `
    ${flowbar(2)}
    <h1>制作タイム</h1>
    <p class="lead">Figmaで「${o.make}」。この画面は横に置いて使ってください。<span id="timer" style="font-weight:600"></span></p>
    <div class="btnrow" style="margin-bottom:20px">
      <button class="btn secondary" style="max-width:260px" onclick="go('s3')">📖 インプットを見返す</button>
    </div>
    <div class="card"><div class="sectionlabel">完成条件チェックリスト(自分でチェックしながら)</div>
      <div class="checklist">${checklistHtml(o)}</div></div>
    <div class="sectionlabel">詰まったら(開くのは任意・段階式)</div>
    ${o.hints.map(([s,b])=>`<details class="hint"><summary>${s}</summary><div class="hintbody">${b}</div></details>`).join('')}
    <div class="btnrow" style="margin-top:24px">
      <button class="btn primary" onclick="go('s5')">完成した — 見比べる</button>
    </div>
    <p class="hintnote" style="font-size:12px;color:var(--ter)">まだ途中でも見比べられます(未完成でも学びは成立します)。</p>`;
}
function tick() {
  const t0 = state.startedAt[state.odai];
  if (!t0) return;
  const m = Math.floor((Date.now()-t0)/60000), s = Math.floor((Date.now()-t0)/1000)%60;
  const el = document.getElementById('timer');
  if (el) el.textContent = `(経過 ${m}:${String(s).padStart(2,'0')})`;
  setTimeout(tick, 1000);
}

/* ---- S5 比較 ---- */
function renderCompare() {
  const o = cur(), c = o.compare;
  const saved = state.compare[state.odai] || {};
  const realCol = c.real.img
    ? `<img class="timg" src="${c.real.img}" alt="${c.real.label}">`
    : `<div class="obsbox">${c.real.obs.map(x=>'・'+x).join('<br>')}</div>`;
  document.getElementById('compareContainer').innerHTML = `
    ${flowbar(3)}
    <h1>見比べましょう</h1>
    <p class="lead">答え合わせではありません。<b>「判断」を比べます</b> — 模範も「方針の一例」で、理由がお題に合っていればあなたの判断が優ります。</p>
    <div class="three">
      <div class="tcol">
        <div class="tlabel">あなたの作品</div>
        <label class="uploadbox" id="uploadbox">＋ スクショをアップロード<br><span style="font-weight:400">(この端末内でのみ表示・送信されません)</span>
          <input type="file" accept="image/*" style="display:none" onchange="loadOwn(this)"></label>
        <img class="timg" id="ownimg" style="display:none">
        <div class="tsub">Figmaで作った画面のスクリーンショット</div>
      </div>
      <div class="tcol">
        <div class="tlabel">${c.model.label}</div>
        <img class="timg" src="${c.model.img}" alt="模範">
        <div class="tsub">${c.model.sub}<a href="#" onclick="toggleWhy(event)">なぜこの判断か一覧を見る</a></div>
        <div class="whylist" id="whyList">${c.model.why.map(x=>'・'+x).join('<br>')}</div>
      </div>
      <div class="tcol">
        <div class="tlabel">${c.real.label}</div>
        ${realCol}
        <div class="tsub">${c.real.sub}</div>
      </div>
    </div>
    <div class="sectionlabel" style="margin-top:24px">観点別に見る(自分の画面を判定してみましょう)</div>
    ${c.aspects.map(([n,d])=>`<div class="aspect"><div class="aname">${n}</div><div class="adesc">${d}</div>
      <select><option>未判定</option><option>✓ できた</option><option>△ 要修正</option></select></div>`).join('')}
    <div class="card" style="margin-top:24px">
      <div class="sectionlabel">完成条件の最終判定(ブリーフと同じ物差し)</div>
      <div class="checklist">${checklistHtml(o)}</div></div>
    <div class="card" style="margin-top:24px">
      <div class="sectionlabel">3つの問い(作ったいま、あなたなら答えられます)</div>
      <div class="qlabel">① あなたと模範で「同じ判断」をひとつ</div>
      <textarea id="q1" rows="2">${saved.q1||''}</textarea>
      <div class="qlabel">② 「違う判断」をひとつ — どちらの理由がお題に合っていますか?</div>
      <textarea id="q2" rows="2">${saved.q2||''}</textarea>
      <div class="qlabel">③ ${c.q3}</div>
      <textarea id="q3" rows="2" placeholder="${c.q3ph}">${saved.q3||''}</textarea>
    </div>
    <div class="btnrow">
      <button class="btn secondary" onclick="go('s4')">直して再比較する</button>
      <button class="btn primary" onclick="finishCompare()">完了して言語化へ</button>
    </div>
    <p class="err" id="compareErr">3つの問いのうち、最低1つは書いてから進みましょう(ここがこの教材の核です)</p>`;
}
function loadOwn(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    document.getElementById('ownimg').src = e.target.result;
    document.getElementById('ownimg').style.display = 'block';
    document.getElementById('uploadbox').style.display = 'none';
  };
  r.readAsDataURL(f);
}
function toggleWhy(e) {
  e.preventDefault();
  const el = document.getElementById('whyList');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
function finishCompare() {
  const v = id => document.getElementById(id).value.trim();
  const qs = { q1: v('q1'), q2: v('q2'), q3: v('q3') };
  if (!qs.q1 && !qs.q2 && !qs.q3) { document.getElementById('compareErr').style.display='block'; return; }
  state.compare[state.odai] = qs;
  go('s6');
}

/* ---- S6 完了 ---- */
function renderDone() {
  const o = cur();
  const lines = [];
  if (state.notes[state.odai]) lines.push(`<b>フィールドワークの観察</b>: ${state.notes[state.odai]}`);

  ['q1','q2','q3'].forEach((k,i)=>{ if(cp[k]) lines.push(`<b>比較の問い${i+1}</b>: ${cp[k]}`); });
  document.getElementById('doneContainer').innerHTML = `
    ${flowbar(4)}
    <h1>${o.title} 完了 🎉</h1>

      <textarea id="finalWord" rows="3" placeholder="私は…">${state.finalWord[state.odai]||''}</textarea>

    <div class="card"><div class="sectionlabel">今日 身についたパターン</div>
      ${o.learned.map(t=>`<span class="learned">${t}</span>`).join('')}</div>
    <div class="card"><div class="sectionlabel">あなたのセッション記録(ポートフォリオの種)</div>
      <div id="sessionLog" style="font-size:13px;line-height:2">${lines.join('<br>') || '(記録なし)'}</div>
      <button class="btn ghost" onclick="copyLog()">記録をコピーする</button></div>
    <div class="card"><div class="sectionlabel">次のお題</div><p style="font-size:14px">${o.next.text}</p></div>
    <button class="btn primary" onclick="completeAll()">完了する</button>`;
}
function copyLog() {
  navigator.clipboard.writeText(document.getElementById('sessionLog').innerText)
    .then(()=>alert('コピーしました。ポートフォリオの解説文の種にどうぞ。'));
}
function completeAll() {
  const w = document.getElementById('finalWord').value.trim();
  if (!w) { document.getElementById('finalErr').style.display='block'; return; }
  state.finalWord[state.odai] = w;
  state.finished[state.odai] = true;
  save();
  alert(cur().title + ' 完了!\n\nあなたの設計言語:\n「' + w + '」');
  go('s1');
}

/* ---- 保存 ---- */
function save() { try { localStorage.setItem('uitrainer-v04', JSON.stringify(state)); } catch(e){} }
function load() {
  try { const s = JSON.parse(localStorage.getItem('uitrainer-v04')); if (s) Object.assign(state, s); } catch(e){}
  if (!ODAI[state.odai]) state.odai = "01";
}
load();
renderHome();
</script>
</body>
